# XcodeGen spec — run `xcodegen generate` to produce DOONY.xcodeproj.
# (brew install xcodegen)  See docs/SETUP.md.
name: DOONY
options:
  bundleIdPrefix: com.doony
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"   # 1.0 (1) was uploaded and rejected; bump per upload
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: "24Q366W5BQ"            # set your Apple Team ID
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Never strip file protection accidentally:
    ENABLE_BITCODE: NO

targets:
  DOONY:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DOONY
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doony.app
        # Point at the hand-maintained entitlements file. Do NOT use XcodeGen's
        # `entitlements:` key here — exactly like `info:` below, that key means
        # "GENERATE this file", and with no `properties:` it rewrites
        # DOONY.entitlements to an empty <dict/> on every `xcodegen generate`,
        # silently dropping the Data Protection capability. CODE_SIGN_ENTITLEMENTS
        # just references the file instead.
        CODE_SIGN_ENTITLEMENTS: DOONY/DOONY.entitlements
        # Use our hand-maintained Info.plist AS-IS. Do NOT use XcodeGen's `info:`
        # key here — that regenerates/overwrites the file on every `xcodegen
        # generate`, wiping UILaunchScreen (iPhone-16 native resolution) and the
        # location usage keys. INFOPLIST_FILE points at the real file instead.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: DOONY/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # iPhone-only. MUST live here, not under the top-level `settings:` —
        # XcodeGen writes its own target-level default of "1,2", which
        # overrides the project level. Shipping as 1,2 makes App Store
        # Connect demand all four iPad-multitasking orientations (err 90474).
        TARGETED_DEVICE_FAMILY: "1"

  DOONYTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DOONYTests
    dependencies:
      - target: DOONY
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doony.app.tests
        # The test bundle needs its own Info.plist to code sign. The app target
        # deliberately uses a hand-maintained one (GENERATE_INFOPLIST_FILE: NO);
        # the tests have nothing to maintain, so let Xcode generate it.
        GENERATE_INFOPLIST_FILE: YES
