# XcodeGen spec — run `xcodegen generate` to produce DOONY.xcodeproj.
# (brew install xcodegen)  See docs/SETUP.md.
name: DOONY
options:
  bundleIdPrefix: com.doony
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""            # set your Apple Team ID
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Never strip file protection accidentally:
    ENABLE_BITCODE: NO

targets:
  DOONY:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DOONY
    info:
      path: DOONY/Info.plist
    entitlements:
      path: DOONY/DOONY.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doony.app
        GENERATE_INFOPLIST_FILE: NO       # we ship our own Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  DOONYTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DOONYTests
    dependencies:
      - target: DOONY
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.doony.app.tests
